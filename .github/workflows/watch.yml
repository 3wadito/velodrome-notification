name: crous-velodrome-watch

# GitHub kills long runs, so coverage is a chain of runs rather than one
# process. The cron fires every 5 minutes, but the concurrency lock lets only
# one run at a time: the others wait in the queue and start the instant the
# current one ends. That way GitHub's scheduling delay happens while a run is
# still working, instead of leaving a hole after it finishes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crous-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: "VELODROME,CHARMOIS"
          POLL_SECONDS: "30"
          HEARTBEAT_HOURS: "12"
          RUN_SECONDS: "3540"
        run: python crous_watch.py

      - name: Alert if the job itself crashed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s \
            -H "Title: WATCHER CRASHED" \
            -H "Priority: urgent" \
            -H "Tags: skull" \
            -d "The GitHub job failed, so the script is not running. Open the Actions tab and read the failed step. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true

      - name: Persist state
        if: always()
        run: |
          git config user.name "crous-watch"
          git config user.email "actions@github.com"
          git add known.json heartbeat.json phases.json || true
          git diff --staged --quiet && exit 0
          git commit -m "state $(date -u +%FT%TZ)"
          # Overlapping runs can both push, so rebase onto whatever landed
          # first rather than losing this run's state to a rejected push.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "could not persist state after 3 attempts" >&2
